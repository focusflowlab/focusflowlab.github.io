<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weighted grade calculator | FocusFlow Lab</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://thefocusflowlab.com/tools/weighted-grade-calculator/">
  <link rel="stylesheet" href="../../assets/site.css?v=cc14b629">
  <link rel="stylesheet" href="../../study-plan/assets/plan.css?v=81b0c499">
</head>
<body class="embed">
  <main id="main" class="embed-main">
    <h1 class="visually-hidden">Weighted grade calculator</h1>
        <form class="sheet" id="wg-form" novalidate aria-label="Weighted grade calculator">
          <p class="sheet-title">Categories</p>
          <div class="row-head" aria-hidden="true"><span>Category</span><span>Weight %</span><span>Score %</span><span></span></div>
          <ol class="tool-rows" id="wg-rows"></ol>
          <div class="sheet-actions"><button class="btn btn-soft" type="button" id="add-category">Add a category</button></div>
          <p class="error" id="wg-error" role="alert"></p>
          <div class="count-result" aria-live="polite">
            <dl class="totals">
              <div><dt>Grade</dt><dd id="r-grade">–</dd></div>
              <div><dt>Weights entered</dt><dd id="r-weight">0%</dd></div>
              <div><dt>Graded so far</dt><dd id="r-done">0%</dd></div>
            </dl>
            <p class="muted" id="r-note"></p>
          </div>
        </form>
    <p class="embed-credit">Free <a href="https://thefocusflowlab.com/tools/weighted-grade-calculator/" target="_blank" rel="noopener">weighted grade calculator</a> by FocusFlow Lab</p>
  </main>
<script src="/assets/tools/field.js?v=4a6b82ce" defer></script>
<script src="/assets/tools/weighted-grade.js?v=88937571" defer></script>
</body>
</html>
